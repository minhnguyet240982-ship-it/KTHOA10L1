    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                packages: {'[+]': ['mhchem']}
            },
            loader: {load: ['[tex]/mhchem']},

                pageReady: () => {
                    return MathJax.startup.defaultPageReady();

    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Hiệu ứng Radio Button Custom */
        .custom-radio input[type="radio"] { display: none; }
        .custom-radio .radio-mark {
            width: 20px; height: 20px; border: 2px solid #cbd5e1; border-radius: 50%;
            display: inline-block; position: relative; margin-right: 10px; transition: all 0.2s;
        }
        .custom-radio input[type="radio"]:checked + .radio-mark { border-color: #4f46e5; }
        .custom-radio input[type="radio"]:checked + .radio-mark::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 10px; height: 10px;
            background: #4f46e5; border-radius: 50%;
        }
        .option-label {
            display: flex; align-items: center; padding: 12px 16px; margin-bottom: 8px;
            border-radius: 8px; border: 1px solid #e2e8f0; cursor: pointer;
            transition: all 0.2s; background: white;
        }
        .option-label:hover:not(.locked) { background: #f8fafc; border-color: #cbd5e1; }
        .custom-radio input[type="radio"]:checked ~ .option-text { font-weight: 500; color: #4f46e5; }
        .option-label.locked { cursor: not-allowed; opacity: 0.8; }
        
        /* Hiệu ứng cho T/F buttons */
        .tf-btn {
            padding: 8px 16px; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer;
            transition: all 0.2s; font-weight: 500; text-align: center; background: white;
        }
        .tf-btn.selected-true { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .tf-btn.selected-false { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .tf-btn.locked { cursor: not-allowed; opacity: 0.8; }
        /* Pulse cho cảnh báo giờ */
        @keyframes pulse-red {
            0% { color: #ef4444; }
            50% { color: #991b1b; }
            100% { color: #ef4444; }
        }
        .time-warning { animation: pulse-red 2s infinite; font-weight: 700; }
        .time-critical { animation: pulse-red 1s infinite; font-weight: 700; color: #ef4444; }
    </style>
</head>

        // Fisher-Yates Shuffle an toàn bằng crypto
        function secureShuffle(array) {
            let arr = [...array];
            let currentIndex = arr.length, randomIndex;
            const randomBytes = new Uint32Array(1);
            while (currentIndex !== 0) {
                window.crypto.getRandomValues(randomBytes);
                randomIndex = randomBytes[0] % currentIndex;
                currentIndex--;
                [arr[currentIndex], arr[randomIndex]] = [arr[randomIndex], arr[currentIndex]];
            }
            return arr;
        }
        // Tạo UUID
        function generateUUID() {
            if (crypto.randomUUID) return crypto.randomUUID();
            return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
            );
        }

            state.startClientMs = Date.now();
            
            // Xáo trộn đề từng phần
            state.shuffled.part1 = secureShuffle(examSource.part1);
            state.shuffled.part2 = secureShuffle(examSource.part2);
            state.shuffled.part3 = secureShuffle(examSource.part3);
            // Chuyển UI
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('test-screen').classList.remove('hidden');
            document.getElementById('display-name').innerText = state.studentName;
            document.getElementById('display-class').innerText = state.studentClass;
            
            window.scrollTo(0, 0);
            renderQuestions();
            startTimer();
        }
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";
            // PHẦN 1
            let html = `<div class="glass-panel p-6 rounded-2xl mb-8"><h3 class="text-xl font-bold text-pink-600 mb-4 border-b pb-2 uppercase">Phần 1: Trắc nghiệm nhiều lựa chọn (4,5 điểm)</h3><div class="space-y-8">`;
            state.shuffled.part1.forEach((q, idx) => {
                html += `
                <div class="q-block" id="block-${q.id}">
                    <div class="font-semibold text-slate-800 mb-3"><span class="text-indigo-600 mr-1">Câu ${idx + 1}.</span> ${q.text}</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${q.options.map(opt => `
                            <label class="option-label" id="lbl-${q.id}-${opt.key}">
                                <div class="custom-radio">
                                    <input type="radio" name="${q.id}" value="${opt.key}" onchange="handleP1Change('${q.id}', '${opt.key}')">
                                    <span class="radio-mark"></span>
                                </div>
                                <span class="font-bold mr-2 text-slate-600">${opt.key}.</span>
                                <span class="option-text">${opt.text}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div id="ans-${q.id}" class="mt-3 text-sm hidden font-medium"></div>
                </div>`;
            });
            html += `</div></div>`;
            // PHẦN 2
            html += `<div class="glass-panel p-6 rounded-2xl mb-8"><h3 class="text-xl font-bold text-pink-600 mb-4 border-b pb-2 uppercase">Phần 2: Trắc nghiệm Đúng/Sai (4,0 điểm)</h3><div class="space-y-8">`;
            state.shuffled.part2.forEach((q, idx) => {
                html += `
                <div class="q-block" id="block-${q.id}">
                    <div class="font-semibold text-slate-800 mb-3"><span class="text-indigo-600 mr-1">Câu ${idx + 1}.</span> ${q.text}</div>
                    <div class="space-y-3">
                        ${q.statements.map(stmt => `
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 bg-slate-50 border border-slate-200 rounded-lg">
                                <div class="flex-1 text-slate-700 pr-4"><span class="font-bold mr-1">${stmt.label})</span>${stmt.text}</div>
                                <div class="flex gap-2 shrink-0">
                                    <button type="button" id="btn-${q.id}-${stmt.label}-true" class="tf-btn" onclick="handleP2Change('${q.id}', '${stmt.label}', 'Đúng')">Đúng</button>
                                    <button type="button" id="btn-${q.id}-${stmt.label}-false" class="tf-btn" onclick="handleP2Change('${q.id}', '${stmt.label}', 'Sai')">Sai</button>
                                </div>
                            </div>
                            <div id="ans-${q.id}-${stmt.label}" class="text-sm hidden mt-1 ml-2 font-medium"></div>
                        `).join('')}
                    </div>
                </div>`;
            });
            html += `</div></div>`;
            // PHẦN 3
            html += `<div class="glass-panel p-6 rounded-2xl"><h3 class="text-xl font-bold text-pink-600 mb-4 border-b pb-2 uppercase">Phần 3: Trả lời ngắn (1,5 điểm)</h3><div class="space-y-8">`;
            state.shuffled.part3.forEach((q, idx) => {
                html += `
                <div class="q-block" id="block-${q.id}">
                    <div class="font-semibold text-slate-800 mb-3"><span class="text-indigo-600 mr-1">Câu ${idx + 1}.</span> ${q.text}</div>
                    <div>
                        <input type="text" id="input-${q.id}" oninput="handleP3Change('${q.id}', this.value)" 
                            class="w-full sm:w-1/2 px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                            placeholder="Nhập câu trả lời của bạn..." autocomplete="off">
                    </div>
                    <div id="ans-${q.id}" class="mt-3 text-sm hidden font-medium"></div>
                </div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
            // Kích hoạt MathJax render cho các công thức sinh ra động
            if (window.MathJax) {
                MathJax.typesetPromise().catch((err) => console.log('MathJax error: ', err));
            }
        }
        
        function handleP1Change(qId, val) {
            if (state.isSubmitted) return;
            state.answers.part1[qId] = val;
            updateProgress();
        }
        function handleP2Change(qId, label, val) {
            if (state.isSubmitted) return;
            if (!state.answers.part2[qId]) state.answers.part2[qId] = {};
            state.answers.part2[qId][label] = val;
            
            // Cập nhật UI nút T/F
            const btnTrue = document.getElementById(`btn-${qId}-${label}-true`);
            const btnFalse = document.getElementById(`btn-${qId}-${label}-false`);
            
            btnTrue.classList.remove('selected-true');
            btnFalse.classList.remove('selected-false');
            
            if (val === 'Đúng') btnTrue.classList.add('selected-true');
            if (val === 'Sai') btnFalse.classList.add('selected-false');
            
            updateProgress();
        }
        function handleP3Change(qId, val) {
            if (state.isSubmitted) return;
            state.answers.part3[qId] = val;
            updateProgress();
        }
        
        function startTimer() {
            const display = document.getElementById('timer-display');
            
            state.timerInterval = setInterval(() => {
                if (state.isSubmitted) {
                    clearInterval(state.timerInterval);
                    return;
                }
                
                const now = Date.now();
                const elapsedSec = Math.floor((now - state.startClientMs) / 1000);
                const remainingSec = TOTAL_TIME_SEC - elapsedSec;
                
                if (remainingSec <= 0) {
                    clearInterval(state.timerInterval);
                    display.innerText = "00:00";
                    if (!state.isSubmitting && !state.isSubmitted) {
                        alert("Đã hết thời gian làm bài. Hệ thống sẽ tự động nộp bài.");
                        processSubmission();
                    }
                    return;
                }
                const m = Math.floor(remainingSec / 60).toString().padStart(2, '0');
                const s = (remainingSec % 60).toString().padStart(2, '0');
                display.innerText = `${m}:${s}`;
                if (remainingSec <= 60) {
                    display.classList.add('time-critical');
                    display.classList.remove('time-warning');
                } else if (remainingSec <= 300) {
                    display.classList.add('time-warning');
                }
            }, 1000);
        }
        document.getElementById('btn-submit').addEventListener('click', () => {
            if (state.isSubmitted || state.isSubmitting) return;
            if (confirm("Em có chắc chắn muốn nộp bài? Hãy kiểm tra lại các câu chưa làm.")) {
                processSubmission();
            }
        });
        
        // So sánh cho câu Trả lời ngắn, chấp nhận format số
        function isShortAnswerCorrect(student, keyObj) {
            if (!student) return false;
            let s = student.trim().toLowerCase();
            let keys = keyObj.acceptedAnswers.map(k => k.trim().toLowerCase());
            if (keys.includes(s)) return true;
            // Xử lý dấu phẩy, khoảng trắng
            let normS = s.replace(/,/g, '.').replace(/\s+/g, '');
            for (let k of keys) {
                let normK = k.replace(/,/g, '.').replace(/\s+/g, '');
                if (normS === normK) return true;
                
                // So sánh dạng số nếu parse được
                let numS = parseFloat(normS);
                let numK = parseFloat(normK);
                if (!isNaN(numS) && !isNaN(numK) && Math.abs(numS - numK) < 0.0001) {
                    return true;
                }
            }
            return false;
        }
        async function processSubmission() {
            state.isSubmitting = true;
            clearInterval(state.timerInterval);
            
            // Khóa giao diện
            document.querySelectorAll('input, button.tf-btn').forEach(el => {
                el.disabled = true;
                if (el.tagName === 'LABEL') el.classList.add('locked');
                if (el.tagName === 'BUTTON') el.classList.add('locked');
            });
            document.querySelectorAll('.option-label').forEach(el => el.classList.add('locked'));
            
            const btnSubmit = document.getElementById('btn-submit');
            const spinnerSubmit = document.getElementById('submit-spinner');
            btnSubmit.classList.add('cursor-not-allowed', 'opacity-80');
            spinnerSubmit.classList.remove('hidden');
            const thoiGianLamGiay = Math.floor((Date.now() - state.startClientMs) / 1000);
            // Chấm điểm và tạo chiTietBaiLam
            let scoreP1 = 0, scoreP2 = 0, scoreP3 = 0;
            let soDung = 0, soSai = 0, soChuaLam = 0;
            const chiTietBaiLam = [];
            // Chấm P1 (18 câu, mỗi câu 0.25 điểm = 4.5 điểm)
            state.shuffled.part1.forEach((q, idx) => {
                const sAns = state.answers.part1[q.id] || "";
                const isCorrect = sAns === q.correctAnswer;
                const isComplete = sAns !== "";
                const score = isCorrect ? 0.25 : 0;
                
                scoreP1 += score;
                if (!isComplete) soChuaLam++;
                else if (isCorrect) soDung++;
                else soSai++;
                chiTietBaiLam.push({
                    part: 1, order: idx + 1, questionId: q.id,
                    questionText: q.plainText, sourceType: "multiple_choice", mediaSrc: "",
                    studentAnswer: sAns, correctAnswer: q.correctAnswer,
                    isCorrect: isCorrect, isComplete: isComplete,
                    score: score, maxScore: 0.25, statements: []
                });
            });
            // Chấm P2 (4 câu Đúng/Sai, thang điểm: 1 ý=0.1, 2 ý=0.25, 3 ý=0.5, 4 ý=1.0)
            const p2ScoreMap = { 0: 0, 1: 0.10, 2: 0.25, 3: 0.50, 4: 1.00 };
            state.shuffled.part2.forEach((q, idx) => {
                const sAnsObj = state.answers.part2[q.id] || {};
                let correctCount = 0;
                let isComplete = true;
                const stmts = [];
                const sAnsTextArr = [];
                const cAnsTextArr = [];
                q.statements.forEach(stmt => {
                    const s = sAnsObj[stmt.label] || "";
                    if (!s) isComplete = false;
                    const isStmtCorrect = s === stmt.correctAnswer;
                    if (isStmtCorrect && s !== "") correctCount++;
                    
                    sAnsTextArr.push(`${stmt.label}: ${s || "_"}`);
                    cAnsTextArr.push(`${stmt.label}: ${stmt.correctAnswer}`);
                    stmts.push({
                        label: stmt.label, text: stmt.text,
                        studentAnswer: s, correctAnswer: stmt.correctAnswer, isCorrect: isStmtCorrect
                    });
                });
                const score = p2ScoreMap[correctCount] || 0;
                scoreP2 += score;
                const isAllCorrect = correctCount === 4;
                if (!isComplete) soChuaLam++;
                else if (isAllCorrect) soDung++;
                else soSai++; 
                chiTietBaiLam.push({
                    part: 2, order: idx + 1, questionId: q.id,
                    questionText: q.plainText, sourceType: "true_false", mediaSrc: "",
                    studentAnswer: sAnsTextArr.join("; "), correctAnswer: cAnsTextArr.join("; "),
                    isCorrect: isAllCorrect, isComplete: isComplete,
                    score: score, maxScore: 1.00, statements: stmts
                });
            });
            // Chấm P3 (6 câu trả lời ngắn, tổng 1.5 điểm -> mỗi câu 0.25 điểm)
            state.shuffled.part3.forEach((q, idx) => {
                const sAns = (state.answers.part3[q.id] || "").trim();
                const isCorrect = isShortAnswerCorrect(sAns, q);
                const isComplete = sAns !== "";
                const score = isCorrect ? 0.25 : 0;
                
                scoreP3 += score;
                if (!isComplete) soChuaLam++;
                else if (isCorrect) soDung++;
                else soSai++;
                chiTietBaiLam.push({
                    part: 3, order: idx + 1, questionId: q.id,
                    questionText: q.plainText, sourceType: "short_answer", mediaSrc: "",
                    studentAnswer: sAns, correctAnswer: q.correctAnswer,
                    isCorrect: isCorrect, isComplete: isComplete,
                    score: score, maxScore: 0.25, statements: []
                });
            });
            const tongDiem = Math.round((scoreP1 + scoreP2 + scoreP3) * 100) / 100;
            const payload = {
                action: "SUBMIT",
                hoTen: state.studentName,
                lop: state.studentClass,
                attemptId: state.attemptId,
                mon: "Hóa học 10",
                diem: tongDiem,
                soDung: soDung,
                soSai: soSai,
                soChuaLam: soChuaLam,
                tongSoCau: 28,
                diemPhan1: scoreP1,
                diemPhan2: scoreP2,
                diemPhan3: scoreP3,
                thoiGianVaoLam: state.serverStartTime,
                thoiGianLamGiay: thoiGianLamGiay,
                chiTietBaiLam: chiTietBaiLam
            };
            try {
                let data;
                if (APPS_SCRIPT_WEB_APP_URL === "DAN_URL_WEB_APP_APPS_SCRIPT_VAO_DAY") {
                    await new Promise(r => setTimeout(r, 1000));
                    data = { status: "SUCCESS", driveSaved: true };
                } else {
                    const response = await fetch(APPS_SCRIPT_WEB_APP_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload),
                        redirect: "follow"
                    });
                    data = await response.json();
                }
                state.isSubmitted = true;
                showResult(payload, data);
            } catch (error) {
                console.error("SUBMIT Error:", error);
                alert("Lỗi khi lưu điểm lên hệ thống. Vui lòng thử bấm nộp lại hoặc báo giáo viên.\nLỗi: " + error.message);
                state.isSubmitting = false;
                btnSubmit.classList.remove('cursor-not-allowed', 'opacity-80');
                spinnerSubmit.classList.add('hidden');
            }
        }
        function showResult(payload, responseData) {
            document.getElementById('res-name').innerText = state.studentName;
            document.getElementById('res-class').innerText = state.studentClass;
            document.getElementById('res-total-score').innerText = payload.diem.toFixed(2);
            document.getElementById('res-p1-score').innerText = payload.diemPhan1.toFixed(2);
            document.getElementById('res-p2-score').innerText = payload.diemPhan2.toFixed(2);
            document.getElementById('res-p3-score').innerText = payload.diemPhan3.toFixed(2);
            
            const mins = Math.floor(payload.thoiGianLamGiay / 60);
            const secs = payload.thoiGianLamGiay % 60;
            document.getElementById('res-duration').innerText = `${mins} phút ${secs} giây`;
            const driveStatusEl = document.getElementById('res-drive-status');
            const driveIconEl = document.getElementById('icon-drive-status');
            if (responseData.status !== "SUCCESS") {
                document.getElementById('res-sheet-status').innerText = "Có lỗi xảy ra khi lưu điểm!";
                document.getElementById('res-sheet-status').classList.replace('text-green-500', 'text-red-500');
            }
            if (responseData.driveSaved === false) {
                driveStatusEl.innerText = "Điểm đã lưu nhưng hồ sơ Drive bị lỗi. Hãy báo GV.";
                driveStatusEl.classList.add('text-red-600');
                driveIconEl.classList.replace('text-green-500', 'text-red-500');
                driveIconEl.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            }
            document.getElementById('result-modal').classList.remove('hidden');
        }
        
        document.getElementById('btn-show-answers').addEventListener('click', () => {
            if (!state.isSubmitted) return;
            state.answersRevealed = true;
            document.getElementById('result-modal').classList.add('hidden');
            
            // Xóa nút submit
            document.getElementById('btn-submit').parentElement.classList.add('hidden');
            // Render đáp án P1
            state.shuffled.part1.forEach(q => {
                const sAns = state.answers.part1[q.id];
                const cAns = q.correctAnswer;
                const ansDiv = document.getElementById(`ans-${q.id}`);
                
                if (sAns) document.getElementById(`lbl-${q.id}-${sAns}`).classList.add(sAns === cAns ? 'ring-2' : 'ring-2', sAns === cAns ? 'ring-green-500' : 'ring-red-500', 'bg-slate-50');
                document.getElementById(`lbl-${q.id}-${cAns}`).classList.add('bg-green-100', 'border-green-400');
                
                ansDiv.innerHTML = sAns === cAns ? `<span class="text-green-600">✓ Đúng</span>` : `<span class="text-red-600">✗ Sai. Đáp án đúng: ${cAns}</span>`;
                ansDiv.classList.remove('hidden');
            });
            // Render đáp án P2
            state.shuffled.part2.forEach(q => {
                const sAnsObj = state.answers.part2[q.id] || {};
                let pts = 0, count = 0;
                
                q.statements.forEach(stmt => {
                    const s = sAnsObj[stmt.label];
                    const c = stmt.correctAnswer;
                    const ansDiv = document.getElementById(`ans-${q.id}-${stmt.label}`);
                    
                    if (s === c) count++;
                    ansDiv.innerHTML = s === c ? `<span class="text-green-600">✓ Đúng</span>` : `<span class="text-red-600">✗ Sai. Đáp án là: ${c}</span>`;
                    ansDiv.classList.remove('hidden');
                });
                
                const p2ScoreMap = { 0: 0, 1: 0.10, 2: 0.25, 3: 0.50, 4: 1.00 };
                pts = p2ScoreMap[count] || 0;
                
                const header = document.getElementById(`block-${q.id}`).querySelector('div:first-child');
                header.innerHTML += ` <span class="text-pink-600 ml-2">[Đạt ${pts} điểm]</span>`;
            });
            // Render đáp án P3
            state.shuffled.part3.forEach(q => {
                const sAns = (state.answers.part3[q.id] || "").trim();
                const isCorrect = isShortAnswerCorrect(sAns, q);
                const ansDiv = document.getElementById(`ans-${q.id}`);
                const input = document.getElementById(`input-${q.id}`);
                
                input.classList.add(isCorrect ? 'bg-green-50' : 'bg-red-50', isCorrect ? 'border-green-400' : 'border-red-400', 'text-slate-900');
                
                ansDiv.innerHTML = isCorrect 
                    ? `<span class="text-green-600">✓ Đúng</span>` 
                    : `<span class="text-red-600">✗ Sai. Đáp án đúng: <strong class="text-indigo-700">${q.correctAnswer}</strong></span>`;
                ansDiv.classList.remove('hidden');
            });
            window.scrollTo(0, 0);
        });
        document.getElementById('btn-logout').addEventListener('click', () => {
            window.location.reload();
        });
    </script>
